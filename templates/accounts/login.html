{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card narrow">
    <h1>Log in</h1>
    <form method="post" class="form">
        {% csrf_token %}
        {{ form.as_div }}
        <button type="submit" class="button">Log in</button>
    </form>
    <p class="muted">New to ExpiryBox? <a href="{% url 'register' %}">Create an account</a></p>
</div>
{% endblock %}
