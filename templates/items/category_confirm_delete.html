{% extends "base.html" %}
{% block title %}Delete category{% endblock %}
{% block content %}
<div class="card narrow">
    <h1>Delete category</h1>
    <p>Are you sure you want to delete <strong>{{ category.category_name }}</strong>?
       A category that is still used by items cannot be deleted.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="button button-danger">Yes, delete</button>
        <a href="{% url 'category_list' %}" class="button button-light">Cancel</a>
    </form>
</div>
{% endblock %}
