{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card narrow">
    <h1>{{ title }}</h1>
    <p class="muted">The amount saved or lost is taken automatically from the item's price.
       To change it, edit the price of the item.</p>
    <form method="post" class="form">
        {% csrf_token %}
        {{ form.as_div }}
        <button type="submit" class="button">Save</button>
        <a href="{% url 'record_list' %}" class="button button-light">Cancel</a>
    </form>
</div>
{% endblock %}
